version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: signlang_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-signlang_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-signlang_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-signlang_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-signlang_user} -d ${POSTGRES_DB:-signlang_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: signlang_fastapi_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-signlang_user}:${POSTGRES_PASSWORD:-signlang_secure_pass}@db:5432/${POSTGRES_DB:-signlang_db}
      - SECRET_KEY=${SECRET_KEY:-e4b89f81d115e4f5a4a15a81c7b134d193b2a472c1847e9231849184a1d82f71}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:80"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: signlang_react_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
